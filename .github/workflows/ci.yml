name: KADIK CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: kadik-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kadik_ci
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: kadik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kadik_ci -d kadik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://build:build@localhost:5432/kadik_build?schema=public
      TEST_DATABASE_URL: postgresql://kadik_ci:ci_only@localhost:5432/kadik_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - run: npm run build
